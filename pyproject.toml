[project]
name = "jgwl-test-project"
version = "0.1.0"
description = "JGWL 多租户管理系统后端"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy>=2.0.36",
    "aiomysql>=0.2.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "pycryptodome>=3.20.0",
    "cryptography>=46.0.7",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

